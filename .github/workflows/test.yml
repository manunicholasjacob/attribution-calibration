name: tests

# The README claims "a clean clone runs on Linux unchanged". That was an assertion with nothing
# behind it: the package was only ever run on the author's Windows machine. This workflow turns the
# claim into evidence. It is cheap to run because the package depends on numpy and nothing else.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[test]"

      - name: Tests
        run: python -m pytest tests -q

      - name: Demo runs end to end
        run: python demo.py
